services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: catcar
      POSTGRES_USER: catcar
      POSTGRES_PASSWORD: catcar_local
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catcar"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ConnectionStrings__catcar=Host=postgres;Database=catcar;Username=catcar;Password=catcar_local
      - ASPNETCORE_ENVIRONMENT=Development
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
