name: Database Infrastructure CI

on:
  push:
    branches: [main]
    paths:
      - "infra/database/**"
      - ".github/workflows/db-infra-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "infra/database/**"
      - ".github/workflows/db-infra-ci.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  TF_IN_AUTOMATION: "true"
  TF_VAR_resource_group_name: ${{ vars.CATCAR_FOUNDATION_RESOURCE_GROUP }}
  TF_VAR_administrator_password: ${{ secrets.POSTGRES_ADMIN_PASSWORD || format('CiValidation-{0}-Admin!', github.run_id) }}
  TF_VAR_auth_readonly_password: ${{ secrets.POSTGRES_AUTH_READONLY_PASSWORD || format('CiValidation-{0}-Readonly!', github.run_id) }}
jobs:
  terraform:
    name: Format, Validate, and Plan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/database

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3

      - name: Authenticate to Azure with GitHub OIDC
        if: ${{ vars.AZURE_CLIENT_ID != '' && (github.event_name == 'pull_request' || github.ref == 'refs/heads/main') }}
        uses: azure/login@8216e11d8cd9b42fe925c852af8e76311ff067ac # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform format check
        run: terraform fmt -check -recursive

      - name: Initialize providers without backend
        run: terraform init -backend=false

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        if: ${{ vars.AZURE_CLIENT_ID != '' && (github.event_name == 'pull_request' || github.ref == 'refs/heads/main') }}
        run: terraform plan -input=false -lock=false -out=tfplan

      - name: Upload Terraform plan
        if: ${{ vars.AZURE_CLIENT_ID != '' && (github.event_name == 'pull_request' || github.ref == 'refs/heads/main') }}
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4
        with:
          name: catcar-database-infra-plan
          path: infra/database/tfplan
          retention-days: 7
