name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  DOTNET_VERSION: '10.0.x'

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: catcar
          POSTGRES_USER: catcar
          POSTGRES_PASSWORD: catcar_local
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore local tools
        run: dotnet tool restore

      - name: Install Azure Functions Core Tools
        run: npm install -g azure-functions-core-tools@4.14.0

      - name: Restore
        run: dotnet restore CatCar.slnx

      - name: Build
        run: dotnet build CatCar.slnx --no-restore -c Release
      - name: Format check
        run: dotnet format whitespace CatCar.slnx --verify-no-changes --no-restore

      - name: Test suite with coverage
        run: dotnet test CatCar.slnx --no-build -c Release --collect:"XPlat Code Coverage" --results-directory ./TestResults/Coverage --logger "trx;LogFileName=all-tests.trx" -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover
        env:
          ConnectionStrings__catcar: Host=localhost;Database=catcar;Username=catcar;Password=catcar_local

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: '**/TestResults/Coverage/**/coverage.opencover.xml'

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/*.trx'
  opengrep:
    name: Opengrep SAST Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Opengrep
        run: |
          mkdir -p "$RUNNER_TEMP/opengrep"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location "https://github.com/opengrep/opengrep/releases/download/v1.28.0/opengrep_manylinux_x86" -o "$RUNNER_TEMP/opengrep/opengrep"
          echo "85af2f34e5175995acbc431e1ca733e34062aad9640ad4308422abe1968b84cf  $RUNNER_TEMP/opengrep/opengrep" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/opengrep/opengrep"
          echo "$RUNNER_TEMP/opengrep" >> $GITHUB_PATH

      - name: Run Opengrep Scan
        run: |
          mkdir -p artifacts/security
          opengrep scan --config p/csharp --config p/security-audit --sarif-output artifacts/security/opengrep.sarif --json-output artifacts/security/opengrep.json

      - name: Opengrep Summary and Gate
        if: always()
        run: |
          if [ -f artifacts/security/opengrep.json ]; then
            ERROR_COUNT=$(jq '[.results[]? | select(.extra.severity == "ERROR")] | length' artifacts/security/opengrep.json)
            WARNING_COUNT=$(jq '[.results[]? | select(.extra.severity == "WARNING")] | length' artifacts/security/opengrep.json)
            INFO_COUNT=$(jq '[.results[]? | select(.extra.severity == "INFO")] | length' artifacts/security/opengrep.json)
            echo "### Opengrep SAST Scan Summary" >> $GITHUB_STEP_SUMMARY
            echo "- **ERROR:** $ERROR_COUNT" >> $GITHUB_STEP_SUMMARY
            echo "- **WARNING:** $WARNING_COUNT" >> $GITHUB_STEP_SUMMARY
            echo "- **INFO:** $INFO_COUNT" >> $GITHUB_STEP_SUMMARY
            if [ "$ERROR_COUNT" -gt 0 ]; then
              echo "::error::Opengrep found $ERROR_COUNT ERROR severity findings."
              exit 1
            fi
          else
            echo "::error::Opengrep JSON output report not found."
            exit 1
          fi

      - name: Upload Opengrep Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opengrep-security-report
          path: artifacts/security/opengrep.*
          retention-days: 90

      - name: Upload Opengrep SARIF
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: artifacts/security/opengrep.sarif
          category: opengrep

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore CatCar.slnx

      - name: NuGet vulnerability scan
        run: |
          mkdir -p artifacts/security
          dotnet package list --project CatCar.slnx --vulnerable --include-transitive --format json --output-version 1 --no-restore > artifacts/security/nuget-vulnerabilities.json

      - name: Analyze NuGet Vulnerabilities
        if: always()
        run: |
          if [ -f artifacts/security/nuget-vulnerabilities.json ]; then
            CRITICAL_COUNT=$(jq '[.projects[]?.frameworks[]?.topLevelPackages[]?.vulnerabilities[]?, .projects[]?.frameworks[]?.transitivePackages[]?.vulnerabilities[]? | select(.severity == "Critical")] | length' artifacts/security/nuget-vulnerabilities.json)
            HIGH_COUNT=$(jq '[.projects[]?.frameworks[]?.topLevelPackages[]?.vulnerabilities[]?, .projects[]?.frameworks[]?.transitivePackages[]?.vulnerabilities[]? | select(.severity == "High")] | length' artifacts/security/nuget-vulnerabilities.json)
            MODERATE_COUNT=$(jq '[.projects[]?.frameworks[]?.topLevelPackages[]?.vulnerabilities[]?, .projects[]?.frameworks[]?.transitivePackages[]?.vulnerabilities[]? | select(.severity == "Moderate")] | length' artifacts/security/nuget-vulnerabilities.json)
            LOW_COUNT=$(jq '[.projects[]?.frameworks[]?.topLevelPackages[]?.vulnerabilities[]?, .projects[]?.frameworks[]?.transitivePackages[]?.vulnerabilities[]? | select(.severity == "Low")] | length' artifacts/security/nuget-vulnerabilities.json)
            
            echo "### NuGet Dependency Vulnerability Summary" >> $GITHUB_STEP_SUMMARY
            echo "- **Critical:** $CRITICAL_COUNT" >> $GITHUB_STEP_SUMMARY
            echo "- **High:** $HIGH_COUNT" >> $GITHUB_STEP_SUMMARY
            echo "- **Moderate:** $MODERATE_COUNT" >> $GITHUB_STEP_SUMMARY
            echo "- **Low:** $LOW_COUNT" >> $GITHUB_STEP_SUMMARY
            
            TOTAL_BLOCKING=$((CRITICAL_COUNT + HIGH_COUNT))
            if [ "$TOTAL_BLOCKING" -gt 0 ]; then
              echo "::error::NuGet vulnerability scan found $CRITICAL_COUNT Critical and $HIGH_COUNT High severity vulnerabilities."
              exit 1
            fi
          else
            echo "::error::NuGet vulnerability JSON output report not found."
            exit 1
          fi

      - name: Upload NuGet Vulnerability Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nuget-vulnerability-report
          path: artifacts/security/nuget-vulnerabilities.json
          retention-days: 90

  docker:
    name: Docker Build & Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: catcar:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Prepare Security Artifacts Directory
        run: mkdir -p artifacts/security

      - name: Run Trivy vulnerability scanner (JSON)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: catcar:ci
          format: 'json'
          output: 'artifacts/security/trivy-image.json'
          exit-code: '0'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: Run Trivy vulnerability scanner (SARIF)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: catcar:ci
          format: 'sarif'
          output: 'artifacts/security/trivy-image.sarif'
          exit-code: '0'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: Trivy Summary and Gate
        if: always()
        run: |
          if [ -f artifacts/security/trivy-image.json ]; then
            HIGH_COUNT=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "HIGH")] | length' artifacts/security/trivy-image.json)
            CRITICAL_COUNT=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL")] | length' artifacts/security/trivy-image.json)
            echo "### Trivy Container Image Scan Summary" >> $GITHUB_STEP_SUMMARY
            echo "- **CRITICAL:** $CRITICAL_COUNT" >> $GITHUB_STEP_SUMMARY
            echo "- **HIGH:** $HIGH_COUNT" >> $GITHUB_STEP_SUMMARY
            TOTAL_VULNS=$((HIGH_COUNT + CRITICAL_COUNT))
            if [ "$TOTAL_VULNS" -gt 0 ]; then
              echo "::error::Trivy container scan found $CRITICAL_COUNT CRITICAL and $HIGH_COUNT HIGH vulnerabilities."
              exit 1
            fi
          else
            echo "::error::Trivy JSON output report not found."
            exit 1
          fi

      - name: Upload Trivy Vulnerability Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-vulnerability-report
          path: artifacts/security/trivy-image.*
          retention-days: 90

      - name: Upload Trivy SARIF
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: artifacts/security/trivy-image.sarif
          category: trivy-image

  publish-model:
    name: Validate Aspire Publish Model
    runs-on: ubuntu-latest
    needs: [build-and-test]
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore local tools
        run: dotnet tool restore

      - name: Publish Aspire deployment model (Production)
        env:
          Parameters__foundation_resource_group: rg-catcar-ci-validate
          Parameters__acr_name: crccarval
          Parameters__acr_login_server: crccarval.azurecr.io
          Parameters__log_analytics_workspace_name: log-catcar-ci-validate
          Parameters__application_insights_name: appi-catcar-ci-validate
          Parameters__api_image_name: crccarval.azurecr.io/catcar-api
          Parameters__api_image_tag: ci-validate
          Parameters__jwt_secret: Y2ktZHVtbXktc2VjcmV0LWZvci1hc3BpcmUtcHVibGlzaC1tb2RlbC12YWxpZGF0aW9uLXRlc3Q=
          Parameters__customer_jwt_signing_key: Y2ktZHVtbXktY3VzdG9tZXItc2lnbmluZy1rZXktZm9yLXZhbGlkYXRpb24tdGVzdA==
          ConnectionStrings__catcar: Host=localhost;Database=catcar;Username=catcar;Password=catcar_dummy
        run: |
          mkdir -p artifacts/aspire-publish
          dotnet tool run aspire -- publish --non-interactive --environment Production -o ../../artifacts/aspire-publish
        working-directory: src/Host

      - name: Publish Aspire deployment model (LocalKubernetes)
        run: |
          mkdir -p artifacts/aspire-local-kubernetes
          dotnet tool run aspire -- publish --non-interactive --environment LocalKubernetes -o ../../artifacts/aspire-local-kubernetes
        working-directory: src/Host

      - name: Validate generated deployment artifacts
        run: |
          echo "Validating generated Helm and Azure Container Apps deployment artifacts..."
          test -d artifacts/aspire-publish
          test -d artifacts/aspire-local-kubernetes
          find artifacts/aspire-publish artifacts/aspire-local-kubernetes -type f

          # Ensure Helm chart for API workload is generated in Production
          if ! find artifacts/aspire-publish -type f -name "Chart.yaml" | grep -q .; then
            echo "::error::Missing Helm Chart.yaml in published Production artifacts"
            exit 1
          fi

          # Ensure Azure Container Apps / Azure template artifact for auth-function exists in Production
          if ! find artifacts/aspire-publish -type f \( -name "*auth-function*" -o -name "*bicep*" -o -name "*json*" -o -name "*yaml*" -o -name "*yml*" \) | grep -q .; then
            echo "::error::Missing publish artifacts for auth-function in Production"
            exit 1
          fi

          # Ensure Helm chart for API workload is generated in LocalKubernetes
          if ! find artifacts/aspire-local-kubernetes -type f -name "Chart.yaml" | grep -q .; then
            echo "::error::Missing Helm Chart.yaml in published LocalKubernetes artifacts"
            exit 1
          fi

      - name: Upload Aspire publish artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aspire-publish-artifacts
          path: |
            artifacts/aspire-publish
            artifacts/aspire-local-kubernetes
          retention-days: 7

  terraform-validate:
    name: Terraform Validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3

      - name: Initialize and validate Kubernetes infrastructure
        env:
          TF_VAR_customer_jwt_signing_key: "ci-validation-dummy-key-minimum-32-chars-long"
        run: |
          terraform -chdir=infra/kubernetes fmt -check -recursive
          terraform -chdir=infra/kubernetes init -backend=false
          terraform -chdir=infra/kubernetes validate

      - name: Initialize and validate Database infrastructure
        run: |
          terraform -chdir=infra/database fmt -check -recursive
          terraform -chdir=infra/database init -backend=false
          terraform -chdir=infra/database validate

  deploy-production:
    name: Provision and Deploy Production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build-and-test, docker, terraform-validate, publish-model]
    runs-on: [self-hosted, linux, x64]
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      TF_VAR_administrator_password: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
      TF_VAR_apim_publisher_name: ${{ vars.APIM_PUBLISHER_NAME }}
      TF_VAR_apim_publisher_email: ${{ vars.APIM_PUBLISHER_EMAIL }}
      TF_VAR_customer_jwt_signing_key: ${{ secrets.CUSTOMER_JWT_SIGNING_KEY }}
      TF_IN_AUTOMATION: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore local tools
        run: dotnet tool restore

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3

      - name: Authenticate to Azure with GitHub OIDC
        uses: azure/login@8216e11d8cd9b42fe925c852af8e76311ff067ac # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: 1. Apply Kubernetes foundation infrastructure
        run: |
          terraform -chdir=infra/kubernetes init \
            -backend-config="resource_group_name=${{ vars.TF_BACKEND_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ vars.TF_BACKEND_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ vars.TF_BACKEND_CONTAINER }}" \
            -backend-config="key=catcar-kubernetes.tfstate"

          terraform -chdir=infra/kubernetes plan -out=tfplan
          terraform -chdir=infra/kubernetes apply -auto-approve tfplan

      - name: 2. Apply Database foundation infrastructure
        run: |
          terraform -chdir=infra/database init \
            -backend-config="resource_group_name=${{ vars.TF_BACKEND_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ vars.TF_BACKEND_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ vars.TF_BACKEND_CONTAINER }}" \
            -backend-config="key=catcar-database.tfstate"

          terraform -chdir=infra/database plan -out=tfplan
          terraform -chdir=infra/database apply -auto-approve tfplan

      - name: 3. Configure AKS and ACR credentials
        run: |
          RESOURCE_GROUP="$(terraform -chdir=infra/kubernetes output -raw resource_group_name)"
          AKS_CLUSTER="$(terraform -chdir=infra/kubernetes output -raw aks_cluster_name)"
          ACR_NAME="$(terraform -chdir=infra/kubernetes output -raw acr_name)"
          ACR_LOGIN_SERVER="$(terraform -chdir=infra/kubernetes output -raw acr_login_server)"
          LOG_ANALYTICS="$(terraform -chdir=infra/kubernetes output -raw log_analytics_workspace_name)"
          APP_INSIGHTS="$(terraform -chdir=infra/kubernetes output -raw application_insights_name)"

          az aks get-credentials --resource-group rg-catcar-prod --name aks-catcar-prod --overwrite-existing

          az acr login --name "$ACR_NAME"

          {
            echo "FOUNDATION_RESOURCE_GROUP=$RESOURCE_GROUP"
            echo "FOUNDATION_ACR_NAME=$ACR_NAME"
            echo "FOUNDATION_ACR_LOGIN_SERVER=$ACR_LOGIN_SERVER"
            echo "FOUNDATION_LOG_ANALYTICS=$LOG_ANALYTICS"
            echo "FOUNDATION_APP_INSIGHTS=$APP_INSIGHTS"
          } >> "$GITHUB_ENV"

      - name: Set up kubelogin for Azure RBAC
        uses: azure/use-kubelogin@v1
        with:
          kubelogin-version: 'v0.1.7'

      - name: Convert kubeconfig for kubelogin
        run: kubelogin convert-kubeconfig -l azurecli

      - name: 4. Sync signing secrets and export masked deployment credentials
        env:
          ADMIN_JWT_SECRET: ${{ secrets.JWT_SECRET }}
          CUSTOMER_JWT_SIGNING_KEY: ${{ secrets.CUSTOMER_JWT_SIGNING_KEY }}
        run: |
          KEY_VAULT_NAME="$(terraform -chdir=infra/database output -raw key_vault_name)"

          # Synchronize signing secrets securely into Azure Key Vault using stdin
          printf "%s" "$ADMIN_JWT_SECRET" | az keyvault secret set --vault-name "$KEY_VAULT_NAME" --name "jwt-secret" --file /dev/stdin --output none
          printf "%s" "$CUSTOMER_JWT_SIGNING_KEY" | az keyvault secret set --vault-name "$KEY_VAULT_NAME" --name "customer-jwt-signing-key" --file /dev/stdin --output none

          # Fetch secrets from Key Vault
          POSTGRES_CONNECTION_STRING="$(az keyvault secret show --vault-name "$KEY_VAULT_NAME" --name postgres-connection-string --query value --output tsv)"
          JWT_SECRET="$(az keyvault secret show --vault-name "$KEY_VAULT_NAME" --name jwt-secret --query value --output tsv)"
          CUSTOMER_SIGNING_KEY="$(az keyvault secret show --vault-name "$KEY_VAULT_NAME" --name customer-jwt-signing-key --query value --output tsv)"

          # Mask secret values in GitHub Actions logs
          echo "::add-mask::$POSTGRES_CONNECTION_STRING"
          echo "::add-mask::$JWT_SECRET"
          echo "::add-mask::$CUSTOMER_SIGNING_KEY"

          # Export into step environment for downstream deployment steps
          {
            echo "DEPLOY_POSTGRES_CONNECTION_STRING=$POSTGRES_CONNECTION_STRING"
            echo "DEPLOY_JWT_SECRET=$JWT_SECRET"
            echo "DEPLOY_CUSTOMER_JWT_SIGNING_KEY=$CUSTOMER_SIGNING_KEY"
          } >> "$GITHUB_ENV"

      - name: 5. Build and push immutable API image to ACR
        id: api-image
        run: |
          ACR_LOGIN_SERVER="${FOUNDATION_ACR_LOGIN_SERVER}"
          IMAGE_NAME="${ACR_LOGIN_SERVER}/catcar-api"
          IMAGE_TAG="${GITHUB_SHA}"
          IMAGE="${IMAGE_NAME}:${IMAGE_TAG}"

          docker build --tag "$IMAGE" .
          docker push "$IMAGE"

          echo "image_name=$IMAGE_NAME" >> "$GITHUB_OUTPUT"
          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: 6. Publish and validate production deployment model
        env:
          Parameters__foundation_resource_group: ${{ env.FOUNDATION_RESOURCE_GROUP }}
          Parameters__acr_name: ${{ env.FOUNDATION_ACR_NAME }}
          Parameters__acr_login_server: ${{ env.FOUNDATION_ACR_LOGIN_SERVER }}
          Parameters__log_analytics_workspace_name: ${{ env.FOUNDATION_LOG_ANALYTICS }}
          Parameters__application_insights_name: ${{ env.FOUNDATION_APP_INSIGHTS }}
          Parameters__api_image_name: ${{ steps.api-image.outputs.image_name }}
          Parameters__api_image_tag: ${{ steps.api-image.outputs.image_tag }}
          Parameters__jwt_secret: ${{ env.DEPLOY_JWT_SECRET }}
          Parameters__customer_jwt_signing_key: ${{ env.DEPLOY_CUSTOMER_JWT_SIGNING_KEY }}
          ConnectionStrings__catcar: ${{ env.DEPLOY_POSTGRES_CONNECTION_STRING }}
        run: |
          mkdir -p artifacts/aspire-prod-publish
          dotnet tool run aspire -- publish --non-interactive --environment Production -o ../../artifacts/aspire-prod-publish
        working-directory: src/Host

      - name: 7. Materialize migration secrets and execute database migration Job
        env:
          IMAGE: ${{ steps.api-image.outputs.image }}
          POSTGRES_CONNECTION_STRING: ${{ env.DEPLOY_POSTGRES_CONNECTION_STRING }}
          JWT_SECRET: ${{ env.DEPLOY_JWT_SECRET }}
        run: |
          # Ensure namespace catcar exists
          kubectl create namespace catcar --dry-run=client -o yaml | kubectl apply -f -

          # Apply migration ConfigMap
          kubectl apply -f - <<EOF
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: catcar-migration-config
            namespace: catcar
          data:
            ASPNETCORE_ENVIRONMENT: Production
            Serilog__MinimumLevel: Information
          EOF

          # Create migration runtime Secret
          kubectl create secret generic catcar-migration-secret \
            --namespace catcar \
            --from-literal="ConnectionStrings__catcar=$POSTGRES_CONNECTION_STRING" \
            --from-literal="Jwt__Secret=$JWT_SECRET" \
            --dry-run=client \
            --output=yaml | kubectl apply -f -

          # Prepare and execute migration Job
          kubectl delete job catcar-db-migration -n catcar --ignore-not-found

          sed -e "s|__ACR_LOGIN_SERVER__/catcar-api:__IMAGE_TAG__|$IMAGE|g" \
              -e "s|name: catcar-config|name: catcar-migration-config|g" \
              -e "s|name: catcar-secret|name: catcar-migration-secret|g" \
              k8s/migration-job.yaml | kubectl apply -n catcar -f -

          kubectl wait --namespace catcar --for=condition=complete job/catcar-db-migration --timeout=300s

      - name: 8. Deploy workloads with Aspire
        env:
          Azure__SubscriptionId: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          Azure__Location: ${{ vars.AZURE_LOCATION || 'eastus2' }}
          Azure__ResourceGroup: ${{ vars.ASPIRE_WORKLOAD_RESOURCE_GROUP || 'rg-catcar-workloads-prod' }}
          Parameters__foundation_resource_group: ${{ env.FOUNDATION_RESOURCE_GROUP }}
          Parameters__acr_name: ${{ env.FOUNDATION_ACR_NAME }}
          Parameters__acr_login_server: ${{ env.FOUNDATION_ACR_LOGIN_SERVER }}
          Parameters__log_analytics_workspace_name: ${{ env.FOUNDATION_LOG_ANALYTICS }}
          Parameters__application_insights_name: ${{ env.FOUNDATION_APP_INSIGHTS }}
          Parameters__api_image_name: ${{ steps.api-image.outputs.image_name }}
          Parameters__api_image_tag: ${{ steps.api-image.outputs.image_tag }}
          Parameters__jwt_secret: ${{ env.DEPLOY_JWT_SECRET }}
          Parameters__customer_jwt_signing_key: ${{ env.DEPLOY_CUSTOMER_JWT_SIGNING_KEY }}
          ConnectionStrings__catcar: ${{ env.DEPLOY_POSTGRES_CONNECTION_STRING }}
        run: |
          dotnet tool run aspire -- deploy --non-interactive --environment Production
        working-directory: src/Host

      - name: 9. Verify deployment rollout
        run: |
          helm status catcar -n catcar
          kubectl rollout status deployment/catcar-api -n catcar --timeout=300s
