name: CI/CD

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: catcar-app-prod
  cancel-in-progress: false

env:
  DOTNET_VERSION: '10.0.x'

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: catcar
          POSTGRES_USER: catcar
          POSTGRES_PASSWORD: catcar_local
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          token: ${{ secrets.SUBMODULE_PAT || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Checkout customer authentication function
        uses: actions/checkout@v4
        with:
          repository: RiseOn-CatCar/catcar-auth-function
          path: catcar-auth-function

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore local tools
        run: dotnet tool restore

      - name: Restore
        run: dotnet restore CatCar.slnx

      - name: Build
        run: dotnet build CatCar.slnx --no-restore -c Release

      - name: Format check
        run: dotnet format whitespace CatCar.slnx --verify-no-changes --no-restore

      - name: Test suite with coverage
        run: dotnet test CatCar.slnx --no-build -c Release --collect:"XPlat Code Coverage" --results-directory ./TestResults/Coverage --logger "trx;LogFileName=all-tests.trx" -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover
        env:
          ConnectionStrings__catcar: Host=localhost;Database=catcar;Username=catcar;Password=catcar_local

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: '**/TestResults/Coverage/**/coverage.opencover.xml'

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/*.trx'

  opengrep:
    name: Opengrep SAST Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          token: ${{ secrets.SUBMODULE_PAT || secrets.GITHUB_TOKEN }}

      - name: Install Opengrep
        run: |
          mkdir -p "$RUNNER_TEMP/opengrep"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location "https://github.com/opengrep/opengrep/releases/download/v1.28.0/opengrep_manylinux_x86" -o "$RUNNER_TEMP/opengrep/opengrep"
          echo "85af2f34e5175995acbc431e1ca733e34062aad9640ad4308422abe1968b84cf  $RUNNER_TEMP/opengrep/opengrep" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/opengrep/opengrep"
          echo "$RUNNER_TEMP/opengrep" >> $GITHUB_PATH

      - name: Run Opengrep Scan
        run: |
          mkdir -p artifacts/security
          opengrep scan --config p/csharp --config p/security-audit --sarif-output artifacts/security/opengrep.sarif --json-output artifacts/security/opengrep.json

      - name: Opengrep Summary and Gate
        if: always()
        run: |
          if [ -f artifacts/security/opengrep.json ]; then
            ERROR_COUNT=$(jq '[.results[]? | select(.extra.severity == "ERROR")] | length' artifacts/security/opengrep.json)
            WARNING_COUNT=$(jq '[.results[]? | select(.extra.severity == "WARNING")] | length' artifacts/security/opengrep.json)
            INFO_COUNT=$(jq '[.results[]? | select(.extra.severity == "INFO")] | length' artifacts/security/opengrep.json)
            echo "### Opengrep SAST Scan Summary" >> $GITHUB_STEP_SUMMARY
            echo "- **ERROR:** $ERROR_COUNT" >> $GITHUB_STEP_SUMMARY
            echo "- **WARNING:** $WARNING_COUNT" >> $GITHUB_STEP_SUMMARY
            echo "- **INFO:** $INFO_COUNT" >> $GITHUB_STEP_SUMMARY
            if [ "$ERROR_COUNT" -gt 0 ]; then
              echo "::error::Opengrep found $ERROR_COUNT ERROR severity findings."
              exit 1
            fi
          else
            echo "::error::Opengrep JSON output report not found."
            exit 1
          fi

      - name: Upload SARIF report
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: artifacts/security/opengrep.sarif
          category: opengrep

  deploy-production:
    name: Deploy Production API Workload
    needs: [build-and-test, opengrep]
    if: startsWith(github.ref, 'refs/tags/v') && (vars.AZURE_CLIENT_ID != '' || vars.AZURE_DEPLOY_CLIENT_ID != '')
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          token: ${{ secrets.SUBMODULE_PAT || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Validate Release Tag Contract
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          echo "Validating tag $TAG_NAME..."
          if [[ ! "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag $TAG_NAME does not follow strict SemVer syntax (vX.Y.Z)"
            exit 1
          fi
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag commit $GITHUB_SHA is not reachable from origin/main"
            exit 1
          fi
          echo "Tag $TAG_NAME contract validated successfully."

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore local tools
        run: dotnet tool restore

      - name: Authenticate to Azure with GitHub OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_DEPLOY_CLIENT_ID || vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure Production Services Started (Idempotent Pre-start)
        run: |
          RESOURCE_GROUP="${{ vars.CATCAR_FOUNDATION_RESOURCE_GROUP || 'catcar-prod' }}"
          POSTGRES_SERVER="${{ vars.CATCAR_POSTGRES_SERVER || 'psql-catcar-prod' }}"
          AKS_CLUSTER="${{ vars.CATCAR_AKS_CLUSTER_NAME || 'aks-catcar-prod' }}"

          PSQL_STATE=$(az postgres flexible-server show --resource-group "$RESOURCE_GROUP" --name "$POSTGRES_SERVER" --query "state" -o tsv 2>/dev/null || echo "Unknown")
          if [[ "$PSQL_STATE" == "Stopped" ]]; then
            echo "Starting PostgreSQL flexible server $POSTGRES_SERVER..."
            az postgres flexible-server start --resource-group "$RESOURCE_GROUP" --name "$POSTGRES_SERVER" --no-wait
          fi

          AKS_POWER=$(az aks show --resource-group "$RESOURCE_GROUP" --name "$AKS_CLUSTER" --query "powerState.code" -o tsv 2>/dev/null || echo "Unknown")
          if [[ "$AKS_POWER" == "Stopped" ]]; then
            echo "Starting AKS cluster $AKS_CLUSTER..."
            az aks start --resource-group "$RESOURCE_GROUP" --name "$AKS_CLUSTER" --no-wait
          fi

      - name: Configure AKS and ACR credentials
        run: |
          RESOURCE_GROUP="${{ vars.CATCAR_FOUNDATION_RESOURCE_GROUP || 'catcar-prod' }}"
          AKS_CLUSTER="${{ vars.CATCAR_AKS_CLUSTER_NAME || 'aks-catcar-prod' }}"
          SUB_HASH=$(echo -n "${{ vars.AZURE_SUBSCRIPTION_ID }}" | sha256sum | cut -d' ' -f1 | cut -c1-8)
          ACR_NAME="${{ vars.ACR_NAME || format('catcarprod{0}', SUB_HASH) }}"
          ACR_LOGIN_SERVER="${ACR_NAME}.azurecr.io"

          az aks get-credentials --resource-group "$RESOURCE_GROUP" --name "$AKS_CLUSTER" --overwrite-existing
          az acr login --name "$ACR_NAME"

          echo "FOUNDATION_RESOURCE_GROUP=$RESOURCE_GROUP" >> "$GITHUB_ENV"
          echo "FOUNDATION_ACR_NAME=$ACR_NAME" >> "$GITHUB_ENV"
          echo "FOUNDATION_ACR_LOGIN_SERVER=$ACR_LOGIN_SERVER" >> "$GITHUB_ENV"

      - name: Set up kubelogin for Azure RBAC
        uses: azure/use-kubelogin@v1.3
        with:
          kubelogin-version: 'v0.1.7'

      - name: Convert kubeconfig for kubelogin
        run: kubelogin convert-kubeconfig -l azurecli

      - name: Fetch secrets from Azure Key Vault
        run: |
          SUB_HASH=$(echo -n "${{ vars.AZURE_SUBSCRIPTION_ID }}" | sha256sum | cut -d' ' -f1 | cut -c1-8)
          KEY_VAULT_NAME="${{ vars.KEY_VAULT_NAME || format('kv-catcar-prod-{0}', SUB_HASH) }}"
          POSTGRES_CONNECTION_STRING="$(az keyvault secret show --vault-name "$KEY_VAULT_NAME" --name postgres-connection-string --query value --output tsv)"
          JWT_SECRET="$(az keyvault secret show --vault-name "$KEY_VAULT_NAME" --name jwt-secret --query value --output tsv || echo '${{ secrets.JWT_SECRET }}')"
          CUSTOMER_SIGNING_KEY="$(az keyvault secret show --vault-name "$KEY_VAULT_NAME" --name customer-jwt-signing-key --query value --output tsv || echo '${{ secrets.CUSTOMER_JWT_SIGNING_KEY }}')"
          GATEWAY_KEY="$(az keyvault secret show --vault-name "$KEY_VAULT_NAME" --name gateway-backend-key --query value --output tsv || echo '${{ secrets.GATEWAY_BACKEND_KEY }}')"

          echo "::add-mask::$POSTGRES_CONNECTION_STRING"
          echo "::add-mask::$JWT_SECRET"
          echo "::add-mask::$CUSTOMER_SIGNING_KEY"
          echo "::add-mask::$GATEWAY_KEY"

          {
            echo "DEPLOY_POSTGRES_CONNECTION_STRING=$POSTGRES_CONNECTION_STRING"
            echo "DEPLOY_JWT_SECRET=$JWT_SECRET"
            echo "DEPLOY_CUSTOMER_JWT_SIGNING_KEY=$CUSTOMER_SIGNING_KEY"
            echo "DEPLOY_GATEWAY_BACKEND_KEY=$GATEWAY_KEY"
          } >> "$GITHUB_ENV"

      - name: Build and push immutable API image to ACR
        id: api-image-prod
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          IMAGE="${FOUNDATION_ACR_LOGIN_SERVER}/catcar-api:${TAG_NAME}"
          COMMIT_IMAGE="${FOUNDATION_ACR_LOGIN_SERVER}/catcar-api:sha-${GITHUB_SHA}"
          docker build --tag "$IMAGE" --tag "$COMMIT_IMAGE" .
          docker push "$IMAGE"
          docker push "$COMMIT_IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Materialize migration secrets and execute database migration Job
        env:
          IMAGE: ${{ steps.api-image-prod.outputs.image }}
          POSTGRES_CONNECTION_STRING: ${{ env.DEPLOY_POSTGRES_CONNECTION_STRING }}
          JWT_SECRET: ${{ env.DEPLOY_JWT_SECRET }}
        run: |
          kubectl create namespace catcar --dry-run=client -o yaml | kubectl apply -f -

          kubectl apply -f - <<EOF
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: catcar-migration-config
            namespace: catcar
          data:
            ASPNETCORE_ENVIRONMENT: Production
            Serilog__MinimumLevel: Information
          EOF

          kubectl create secret generic catcar-migration-secret \
            --namespace catcar \
            --from-literal="ConnectionStrings__catcar=$POSTGRES_CONNECTION_STRING" \
            --from-literal="Jwt__Secret=$JWT_SECRET" \
            --dry-run=client \
            --output=yaml | kubectl apply -f -

          kubectl delete job catcar-db-migration -n catcar --ignore-not-found

          sed -e "s|__ACR_LOGIN_SERVER__/catcar-api:__IMAGE_TAG__|$IMAGE|g" \
              -e "s|name: catcar-config|name: catcar-migration-config|g" \
              -e "s|name: catcar-secret|name: catcar-migration-secret|g" \
              k8s/migration-job.yaml | kubectl apply -n catcar -f -

          kubectl wait --namespace catcar --for=condition=complete job/catcar-db-migration --timeout=300s

      - name: Deploy API workloads with Aspire
        env:
          Azure__SubscriptionId: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          Azure__Location: ${{ vars.AZURE_LOCATION || 'eastus' }}
          Azure__ResourceGroup: ${{ vars.ASPIRE_WORKLOAD_RESOURCE_GROUP || 'catcar-prod' }}
          Parameters__foundation_resource_group: ${{ env.FOUNDATION_RESOURCE_GROUP }}
          Parameters__acr_name: ${{ env.FOUNDATION_ACR_NAME }}
          Parameters__acr_login_server: ${{ env.FOUNDATION_ACR_LOGIN_SERVER }}
          Parameters__log_analytics_workspace_name: ${{ vars.CATCAR_LOG_ANALYTICS_WORKSPACE_NAME || 'law-catcar-prod' }}
          Parameters__application_insights_name: ${{ vars.CATCAR_APPLICATION_INSIGHTS_NAME || 'appi-catcar-prod' }}
          Parameters__api_public_ip_name: ${{ vars.API_PUBLIC_IP_NAME || 'pip-catcar-prod-api' }}
          Parameters__api_image_name: ${{ env.FOUNDATION_ACR_LOGIN_SERVER }}/catcar-api
          Parameters__api_image_tag: ${{ steps.api-image-prod.outputs.image }}
          Parameters__jwt_secret: ${{ env.DEPLOY_JWT_SECRET }}
          Parameters__customer_jwt_signing_key: ${{ env.DEPLOY_CUSTOMER_JWT_SIGNING_KEY }}
          Parameters__gateway_backend_key: ${{ env.DEPLOY_GATEWAY_BACKEND_KEY }}
          ConnectionStrings__catcar: ${{ env.DEPLOY_POSTGRES_CONNECTION_STRING }}
        run: |
          dotnet tool run aspire -- deploy --non-interactive --environment Production
        working-directory: src/Host

      - name: Verify deployment rollout
        run: |
          helm status catcar -n catcar
          kubectl rollout status deployment/catcar-api -n catcar --timeout=300s
