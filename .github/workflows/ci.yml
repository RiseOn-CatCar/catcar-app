name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_VERSION: '11.0.100'

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - run: dotnet restore CatCar.slnx
      - run: dotnet format whitespace CatCar.slnx --verify-no-changes --no-restore
      - run: dotnet build CatCar.slnx -c Release --no-restore
      - name: Test with OpenCover
        run: dotnet test CatCar.slnx -c Release --no-build --collect:"XPlat Code Coverage" --results-directory TestResults/Coverage -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover
      - name: Enforce 80% service line coverage
        run: |
          python3 - <<'PY'
          import glob
          import os
          import xml.etree.ElementTree as ET

          root = os.path.realpath("src") + os.sep
          lines = {}
          reports = glob.glob("TestResults/Coverage/**/coverage.opencover.xml", recursive=True)
          if not reports:
              raise SystemExit("No OpenCover reports found")
          for report in reports:
              for module in ET.parse(report).iter("Module"):
                  files = {f.get("uid"): os.path.realpath(f.get("fullPath")) for f in module.findall("./Files/File")}
                  for method in module.findall(".//Method"):
                      reference = method.find("FileRef")
                      default_file = reference.get("uid") if reference is not None else None
                      for point in method.findall("./SequencePoints/SequencePoint"):
                          path = files.get(point.get("fileid", default_file), "")
                          relative = os.path.relpath(path, root)
                          parts = relative.replace("\\", "/").split("/")
                          if not path.startswith(root) or any(p.lower() in ("migrations", "obj", "bin") for p in parts) or parts[-1] == "Program.cs" or parts[-1].endswith((".g.cs", ".generated.cs", ".designer.cs")):
                              continue
                          line = int(point.get("sl", "0"))
                          if line > 0:
                              key = (path, line)
                              lines[key] = lines.get(key, False) or int(point.get("vc", "0")) > 0
          covered = sum(lines.values())
          percent = 100 * covered / len(lines) if lines else 0
          print(f"Service line coverage: {covered}/{len(lines)} ({percent:.2f}%)")
          if percent < 80:
              raise SystemExit("Service line coverage is below 80%")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: TestResults/Coverage/**/coverage.opencover.xml
          if-no-files-found: error

  sonar-config:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -n "$SONAR_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

  sonar:
    needs: [build-test, sonar-config]
    if: needs.sonar-config.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          name: coverage-report
          path: TestResults/Coverage
      - name: Install SonarScanner
        run: dotnet tool install --global dotnet-sonarscanner --version 12.1.0
      - name: SonarCloud analysis and quality gate
        run: |
          # Ignored: hard-coded credentials only in the ephemeral CI overlay fixtures and the local docker-compose; plain HTTP only for in-cluster ClusterIP traffic.
          # Generated EF migrations are excluded from duplication detection.
          "$HOME/.dotnet/tools/dotnet-sonarscanner" begin /k:"riseon_catcar-os-service" /o:"riseon" /d:sonar.token="$SONAR_TOKEN" /d:sonar.host.url="https://sonarcloud.io" /d:sonar.qualitygate.wait=true /d:sonar.cs.opencover.reportsPaths="TestResults/Coverage/**/coverage.opencover.xml" /d:sonar.coverage.exclusions="**/Migrations/**,**/Program.cs" /d:sonar.cpd.exclusions="**/Migrations/**" /d:sonar.issue.ignore.multicriteria="ci1,ci2,ci3,ci4,ci5" /d:sonar.issue.ignore.multicriteria.ci1.ruleKey="kubernetes:S2068" /d:sonar.issue.ignore.multicriteria.ci1.resourceKey="k8s/overlays/ci/**" /d:sonar.issue.ignore.multicriteria.ci2.ruleKey="yaml:S2068" /d:sonar.issue.ignore.multicriteria.ci2.resourceKey="k8s/overlays/ci/**" /d:sonar.issue.ignore.multicriteria.ci3.ruleKey="kubernetes:S5332" /d:sonar.issue.ignore.multicriteria.ci3.resourceKey="k8s/**" /d:sonar.issue.ignore.multicriteria.ci4.ruleKey="secrets:S6736" /d:sonar.issue.ignore.multicriteria.ci4.resourceKey="k8s/overlays/ci/**" /d:sonar.issue.ignore.multicriteria.ci5.ruleKey="secrets:S6736" /d:sonar.issue.ignore.multicriteria.ci5.resourceKey="docker-compose.yml"
          dotnet build CatCar.slnx -c Release
          "$HOME/.dotnet/tools/dotnet-sonarscanner" end /d:sonar.token="$SONAR_TOKEN"

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Install Opengrep
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL https://github.com/opengrep/opengrep/releases/download/v1.28.0/opengrep_manylinux_x86 -o "$RUNNER_TEMP/opengrep"
          echo "85af2f34e5175995acbc431e1ca733e34062aad9640ad4308422abe1968b84cf  $RUNNER_TEMP/opengrep" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/opengrep"
      - name: Opengrep
        run: '"$RUNNER_TEMP/opengrep" scan --config p/csharp --config p/security-audit --error'
      - run: dotnet restore CatCar.slnx
      - name: Scan NuGet vulnerabilities
        run: |
          dotnet package list --project CatCar.slnx --vulnerable --include-transitive --format json --output-version 1 --no-restore > nuget-vulnerabilities.json
          jq -e '[.projects[]?.frameworks[]? | (.topLevelPackages[]?, .transitivePackages[]?) | .vulnerabilities[]? | select(.severity == "Critical" or .severity == "High")] | length == 0' nuget-vulnerabilities.json
      - run: docker build -t catcar-os-service:ci .
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: catcar-os-service:ci
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH

  deploy-kind:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
        with:
          cluster_name: catcar
      - run: docker build -t catcar-os-service:ci .
      - run: kind load docker-image catcar-os-service:ci --name catcar
      - run: kubectl apply -k k8s/overlays/ci
      - name: Wait for dependencies and migration
        run: |
          kubectl rollout status deployment/postgres --timeout=180s
          kubectl rollout status deployment/messaging --timeout=180s
          kubectl wait --for=condition=complete job/os-service-migration --timeout=300s
          kubectl rollout status deployment/os-service --timeout=300s
      - name: Smoke HTTP endpoints
        run: |
          kubectl port-forward service/os-service 18080:8080 > "$RUNNER_TEMP/port-forward.log" 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/health/ready; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:18080/health/ready
          status=$(curl -sS -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' -d '{"email":"nobody@example.com","password":"invalid"}' http://127.0.0.1:18080/api/v1/identity-access/auth/login)
          test "$status" = 401
      - name: Diagnose failures
        if: failure()
        run: |
          kubectl get pods,jobs
          kubectl logs job/os-service-migration --all-containers=true || true
          kubectl logs deployment/os-service --all-containers=true || true
