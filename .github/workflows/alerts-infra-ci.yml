name: Alerts Infrastructure CI

on:
  push:
    branches: [main]
    paths:
      - "infra/alerts/**"
      - ".github/workflows/alerts-infra-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "infra/alerts/**"
      - ".github/workflows/alerts-infra-ci.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  TF_IN_AUTOMATION: "true"

jobs:
  terraform:
    name: Format, Validate, and Plan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/alerts
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
      - name: Terraform format check
        run: terraform fmt -check -recursive
      - name: Initialize providers without backend
        run: terraform init -backend=false
      - name: Terraform validate
        run: terraform validate
      - name: Authenticate to Azure with GitHub OIDC
        if: ${{ vars.AZURE_CLIENT_ID != '' }}
        uses: azure/login@8216e11d8cd9b42fe925c852af8e76311ff067ac # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Terraform plan
        if: ${{ vars.AZURE_CLIENT_ID != '' }}
        run: terraform plan -input=false -lock=false -out=tfplan
      - name: Upload Terraform plan
        if: ${{ vars.AZURE_CLIENT_ID != '' }}
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4
        with:
          name: catcar-alerts-infra-plan
          path: infra/alerts/tfplan
          retention-days: 7
