name: Kubernetes Infrastructure CI

on:
  push:
    branches: [main]
    paths:
      - "infra/kubernetes/**"
      - ".github/workflows/k8s-infra-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "infra/kubernetes/**"
      - ".github/workflows/k8s-infra-ci.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  TF_IN_AUTOMATION: "true"
  TF_VAR_apim_publisher_name: ${{ vars.APIM_PUBLISHER_NAME }}
  TF_VAR_apim_publisher_email: ${{ vars.APIM_PUBLISHER_EMAIL }}

jobs:
  terraform:
    name: Format, Validate, and Plan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/kubernetes

    steps:
      - uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Authenticate to Azure with GitHub OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform format check
        run: terraform fmt -check -recursive

      - name: Initialize providers without backend
        run: terraform init -backend=false

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        run: terraform plan -input=false -lock=false -out=tfplan

      - name: Upload Terraform plan
        uses: actions/upload-artifact@v4
        with:
          name: catcar-kubernetes-infra-plan
          path: infra/kubernetes/tfplan
          retention-days: 7
