name: Auth Function CI

on:
  push:
    paths:
      - 'src/Functions/**'
      - 'tests/Functions/**'
  pull_request:
    paths:
      - 'src/Functions/**'
      - 'tests/Functions/**'

permissions:
  contents: read

env:
  DOTNET_VERSION: '10.0.x'

jobs:
  build-test-publish:
    name: Build, Test & Publish Auth Function
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d214e9c2f7c # v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore Auth Function
        run: dotnet restore src/Functions/CatCar.AuthFunction/CatCar.AuthFunction.csproj

      - name: Build Auth Function
        run: dotnet build src/Functions/CatCar.AuthFunction/CatCar.AuthFunction.csproj --no-restore -c Release

      - name: Test Auth Function
        run: dotnet test tests/Functions/CatCar.AuthFunction.Tests/ -c Release

      - name: Publish Auth Function
        run: dotnet publish src/Functions/CatCar.AuthFunction/CatCar.AuthFunction.csproj -c Release -o ./publish
      - name: Upload Auth Function artifact
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4
        with:
          name: catcar-auth-function
          path: ./publish
          retention-days: 7
