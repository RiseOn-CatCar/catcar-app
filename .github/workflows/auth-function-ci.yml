name: Auth Function CI

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "*.sln"
      - "*.slnx"
      - "Directory.*.props"
      - ".github/workflows/auth-function-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "*.sln"
      - "*.slnx"
      - "Directory.*.props"
      - ".github/workflows/auth-function-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_VERSION: "10.0.x"
  FUNCTION_PROJECT: src/Functions/CatCar.AuthFunction/CatCar.AuthFunction.csproj
  TEST_PROJECT: tests/Functions/CatCar.AuthFunction.Tests/CatCar.AuthFunction.Tests.csproj

jobs:
  build-test-package:
    name: Build, Test, and Package
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore "${FUNCTION_PROJECT}"

      - name: Build
        run: dotnet build "${FUNCTION_PROJECT}" --configuration Release --no-restore

      - name: Test
        run: dotnet test "${TEST_PROJECT}" --configuration Release --logger "trx;LogFileName=auth-function-tests.trx"

      - name: Publish function
        run: dotnet publish "${FUNCTION_PROJECT}" --configuration Release --no-build --output artifacts/auth-function

      - name: Create deployment archive
        run: cd artifacts/auth-function && zip -r ../catcar-auth-function.zip .

      - name: Upload function package
        uses: actions/upload-artifact@v4
        with:
          name: catcar-auth-function
          path: artifacts/catcar-auth-function.zip
          if-no-files-found: error

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auth-function-test-results
          path: "**/auth-function-tests.trx"
          if-no-files-found: ignore
