apiVersion: batch/v1
kind: Job
metadata:
  name: catcar-db-migration
  labels:
    app.kubernetes.io/name: catcar-api
    app.kubernetes.io/component: migration
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: catcar-api
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      containers:
        - name: catcar-db-migration
          image: __ACR_LOGIN_SERVER__/catcar-api:__IMAGE_TAG__
          imagePullPolicy: IfNotPresent
          args:
            - --migrate
          envFrom:
            - configMapRef:
                name: catcar-config
            - secretRef:
                name: catcar-secret
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
              ephemeral-storage: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
              ephemeral-storage: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: tmp
          emptyDir: {}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
