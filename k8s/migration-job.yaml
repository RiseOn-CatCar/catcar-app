# Replace __API_IMAGE__ with an immutable image reference and __RUNTIME_SECRET__
# with the name of a Secret containing the keys referenced below.
# Cloud deployments may override connection and nonsecret configuration via
# catcar-migration-config; they must supply the same Secret key names.
apiVersion: batch/v1
kind: Job
metadata:
  name: catcar-maintenance
  labels:
    app.kubernetes.io/name: catcar-api
    app.kubernetes.io/component: migration
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: catcar-api
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      containers:
        - name: catcar-maintenance
          image: __API_IMAGE__
          imagePullPolicy: IfNotPresent
          args:
            - --migrate
            - --provision-auth-readonly
            - --bootstrap-admin
          envFrom:
            - configMapRef:
                name: catcar-migration-config
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: __RUNTIME_SECRET__
                  key: POSTGRES_PASSWORD
            - name: ConnectionStrings__catcar
              value: "$(DATABASE_CONNECTION_PREFIX)Password=$(POSTGRES_PASSWORD)"
            - name: AuthReadOnly__Password
              valueFrom:
                secretKeyRef:
                  name: __RUNTIME_SECRET__
                  key: POSTGRES_AUTH_READONLY_PASSWORD
            - name: Jwt__Secret
              valueFrom:
                secretKeyRef:
                  name: __RUNTIME_SECRET__
                  key: JWT_SECRET
            - name: CustomerJwt__SigningKey
              valueFrom:
                secretKeyRef:
                  name: __RUNTIME_SECRET__
                  key: CUSTOMER_JWT_SIGNING_KEY
            - name: BootstrapAdmin__Email
              valueFrom:
                secretKeyRef:
                  name: __RUNTIME_SECRET__
                  key: BOOTSTRAP_ADMIN_EMAIL
            - name: BootstrapAdmin__Password
              valueFrom:
                secretKeyRef:
                  name: __RUNTIME_SECRET__
                  key: BOOTSTRAP_ADMIN_PASSWORD
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
              ephemeral-storage: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
              ephemeral-storage: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: tmp
          emptyDir: {}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
