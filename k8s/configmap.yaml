apiVersion: v1
kind: ConfigMap
metadata:
  name: catcar-config
  labels:
    app.kubernetes.io/name: catcar-api
    app.kubernetes.io/component: api
data:
  ASPNETCORE_ENVIRONMENT: Production
  Serilog__MinimumLevel: Information
  Serilog__MinimumLevel__Override__Microsoft: Warning
  Serilog__MinimumLevel__Override__Microsoft_EntityFrameworkCore: Warning
  Jwt__Issuer: CatCar
  Jwt__Audience: CatCar.AdminApi
  Jwt__ExpirationMinutes: "60"
  Communication__ExternalBaseUrl: https://catcar.example.com
  Communication__ApprovalLinkTtlDays: "7"
