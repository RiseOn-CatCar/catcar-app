apiVersion: apps/v1
kind: Deployment
metadata:
  name: catcar-api
  labels:
    app: catcar-api
    app.kubernetes.io/name: catcar-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: catcar-api
  template:
    metadata:
      labels:
        app: catcar-api
        app.kubernetes.io/name: catcar-api
    spec:
      automountServiceAccountToken: false
      containers:
        - name: catcar-api
          image: __ACR_LOGIN_SERVER__/catcar-api:__IMAGE_TAG__
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: catcar-config
            - secretRef:
                name: catcar-secret
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
              ephemeral-storage: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
              ephemeral-storage: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: tmp
          emptyDir: {}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
