apiVersion: v1
kind: Secret
metadata:
  name: os-service-secrets
type: Opaque
stringData:
  ConnectionStrings__catcar: Host=postgres;Database=catcar_os;Username=catcar;Password=catcar_local
  ConnectionStrings__messaging: amqp://catcar:catcar_local@messaging:5672
  Jwt__Secret: ci-only-administrative-signing-key-123456
  CustomerJwt__SigningKey: ci-only-customer-signing-key-123456
  InternalApi__Key: ci-only-internal-api-key-change-me
