apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          env:
            - name: POSTGRES_DB
              value: catcar_os
            - name: POSTGRES_USER
              value: catcar
            - name: POSTGRES_PASSWORD
              value: catcar_local
          readinessProbe:
            exec:
              command: [pg_isready, -U, catcar, -d, catcar_os]
            periodSeconds: 5
          ports:
            - containerPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: messaging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: messaging
  template:
    metadata:
      labels:
        app: messaging
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:4-management-alpine
          env:
            - name: RABBITMQ_DEFAULT_USER
              value: catcar
            - name: RABBITMQ_DEFAULT_PASS
              value: catcar_local
          readinessProbe:
            exec:
              command: [rabbitmq-diagnostics, -q, ping]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 15
          ports:
            - containerPort: 5672
---
apiVersion: v1
kind: Service
metadata:
  name: messaging
spec:
  selector:
    app: messaging
  ports:
    - port: 5672
